# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push, pull request or manual events
on: 
  push:
  pull_request:
  workflow_dispatch:

  # Run GitHub Actions monthly to make sure CI isn't broken
  schedule:
    - cron: '0 0 1 * *'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      matrix:
        runs-on: [windows-latest, ubuntu-latest]
        target: [client, server]
    
    # The type of runner that the job will run on
    runs-on: ${{ matrix.runs-on }}

env:
      VCPKG_ROOT: '${{github.workspace}}/vcpkg'
      VCPKG_DEFAULT_TRIPLET: 'x86-windows-static'
      VCPKG_DEFAULT_HOST_TRIPLET: 'x86-windows-static'

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Required for automatic versioning
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Set up vcpkg
        if: matrix.runs-on == 'windows-latest'
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          vcpkgDirectory: '${{env.VCPKG_ROOT}}'
          vcpkgGitCommitId: 'ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0'
          runVcpkgInstall: false

      - name: Install Ubuntu packages
        if: matrix.runs-on == 'ubuntu-latest'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update || true
          sudo apt install -y libc6:i386 cmake ninja-build gcc-9-multilib g++-9-multilib libssl-dev:i386 zlib1g-dev:i386 freetype-dev:i386

      - name: Build windows release
        if: matrix.runs-on == 'windows-latest'
        id: build
        run: |
          python ./scripts/BuildRelease.py --target ${{ matrix.target }} --build-type release --vs 2022 --toolset v143 --linux-compiler gcc-9 --out-dir ./_build_out --cmake-args="-DWARNINGS_ARE_ERRORS=ON -DCMAKE_TOOLCHAIN_FILE=${{env.VCPKG_ROOT}}/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x86-windows-static" --github-actions

      - name: Build linux release
        if: matrix.runs-on == 'ubuntu-latest'
        id: build
        run: |
          python ./scripts/BuildRelease.py --target ${{ matrix.target }} --build-type release --vs 2022 --toolset v143 --linux-compiler gcc-9 --out-dir ./_build_out --cmake-args="-DWARNINGS_ARE_ERRORS=ON" --github-actions

      - name: Run tests
        run: |
          cd ./_build_out/build
          ctest -R ${{ matrix.target }} --build-config RelWithDebInfo --output-on-failure

      - name: Upload build result
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ./_build_out/BugfixedHL-*.zip
